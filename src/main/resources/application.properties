# DEV
%dev.quarkus.http.port:8088

# Host Forward Rules
# If the incoming host matches host-pattern, the request is redirected with the host-replace-pattern.
# Supports regex capture groups: (.+) for positional groups, (?<name>...) for named groups.
%dev.onecx.redirect.host-forward-rules."rule-1".host-pattern=old-host\\.example\\.com
%dev.onecx.redirect.host-forward-rules."rule-1".host-replace-pattern=new-host.example.com
%dev.onecx.redirect.host-forward-rules."rule-1".protocol-replace-pattern=https

# Example with dynamic host rewriting using capture groups
# Forwards *.old-domain.com to *.new-domain.com
# %dev.onecx.redirect.host-forward-rules."rule-2".host-pattern=(.+)\\.old-domain\\.com
# %dev.onecx.redirect.host-forward-rules."rule-2".host-replace-pattern=$1.new-domain.com
# %dev.onecx.redirect.host-forward-rules."rule-2".protocol-replace-pattern=https

# Rule evaluation mode: combined | separate
%dev.onecx.redirect.rules.mode=combined
%dev.onecx.redirect.rules.redirect-wait-seconds=10
# Use bundled template from src/main/resources/templates (jar classpath)
# %dev.onecx.redirect.bundled-redirect-template-name=redirectWaitTemplate.html

# URL Rewrite Rules
%dev.onecx.redirect.url-rewrite-rules.".*/test-ui/.*"."0".pattern=test-ui/old#id=(?<id>.+)
%dev.onecx.redirect.url-rewrite-rules.".*/test-ui/.*"."0".replace-pattern=/ui/mobile/test/details/($id)

%dev.onecx.redirect.url-rewrite-rules.".*/test-ui-2/.*"."0".pattern=test-ui-2/old#id=(?<id>.+)#test=(?<test>.+)
%dev.onecx.redirect.url-rewrite-rules.".*/test-ui-2/.*"."0".replace-pattern=/ui/mobile/test2/details/($id)/($test)

%dev.onecx.redirect.url-rewrite-rules.".*/test-ui-3/.*"."0".pattern=test-ui-3/old\\\\?id=(?<id>.+)
%dev.onecx.redirect.url-rewrite-rules.".*/test-ui-3/.*"."0".replace-pattern=/ui/mobile/test3/details/($id)

# Rule group: test-order-ui
# Rules are evaluated in index order (0, 1, 2, ...) by the browser against the full URL including fragment.
# Most specific patterns (those requiring a fragment) must come first.
%dev.onecx.redirect.url-rewrite-rules.".*/multiple-test-ui.*"."0".pattern=multiple-test-ui\\\\?u-id=(?<id>[^#]+)#/task/(?<woId>.+)
%dev.onecx.redirect.url-rewrite-rules.".*/multiple-test-ui.*"."0".replace-pattern=/ui/mobile/mobile-workorder-page/workorder/($woId)?u-id=($id)

%dev.onecx.redirect.url-rewrite-rules.".*/multiple-test-ui.*"."1".pattern=multiple-test-ui\\\\?u-id=(?<id>[^#]+)#/testorder/(?<orderId>.+)
%dev.onecx.redirect.url-rewrite-rules.".*/multiple-test-ui.*"."1".replace-pattern=/ui/mobile/mobile-testorder-page/testorder/($orderId)?u-id=($id)

%dev.onecx.redirect.url-rewrite-rules.".*/multiple-test-ui.*"."2".pattern=multiple-test-ui\\\\?u-id=(?<id>.+)
%dev.onecx.redirect.url-rewrite-rules.".*/multiple-test-ui.*"."2".replace-pattern=/ui/mobile/mobile-workorder-page?u-id=($id)


# INTEGRATION TEST
quarkus.test.integration-test-profile=test
tkit.security-dynamic-test.openapi.enabled=false
