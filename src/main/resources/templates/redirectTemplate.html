<html>
<head>
    <script>
        // Unified redirect template: applies path rewrite and host rewrite when available
        try {
            const rules = {rules};
            let redirectUrl = window.location.href;

            // Apply path rewrite first if a matching rule exists
            for (const rule of rules) {
                const regex = new RegExp(rule.pattern);
                const match = redirectUrl.match(regex);
                if (match) {
                    let rewrittenUrl = rule.replacePattern;
                    if (match.groups && Object.keys(match.groups).length > 0) {
                        for (const [key, value] of Object.entries(match.groups)) {
                            rewrittenUrl = rewrittenUrl.replace('($' + key + ')', value);
                        }
                    } else {
                        rewrittenUrl = redirectUrl.replace(regex, rule.replacePattern);
                    }
                    redirectUrl = new URL(rewrittenUrl, window.location.origin).href;
                    break;
                }
            }

            // Apply host/protocol rewrite if a host-forward rule matched
            {#if hostForwardRule}
                const target = new URL(redirectUrl);
                const proxyHost = "{hostForwardRule.proxyHost()}";
                const proxyProtocol = "{hostForwardRule.proxyProtocol().orElse('')}" || target.protocol.slice(0, -1);
                target.hostname = proxyHost;
                target.protocol = proxyProtocol + ":";
                redirectUrl = target.href;
            {/if}

            window.location.href = redirectUrl;
        } catch (e) {
            console.error("Redirect failed:", e);
        }
    </script>
    <noscript>
        <p>You need to enable JavaScript!</p>
    </noscript>
</head>
</html>
