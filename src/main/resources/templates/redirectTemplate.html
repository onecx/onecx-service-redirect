<html>
<head>
    <script>
        // Unified redirect template: applies path rewrite and host rewrite when available
        try {
            const rules = {rules};
            const hostForwardRuleJson = {hostForwardRule};
            const hostForwardRule = hostForwardRuleJson && typeof hostForwardRuleJson === 'string' ? JSON.parse(hostForwardRuleJson) : hostForwardRuleJson;
            let redirectUrl = window.location.href;

            // Apply path rewrite first if a matching rule exists
            for (const rule of rules) {
                const regex = new RegExp(rule.pattern);
                const match = redirectUrl.match(regex);
                if (match) {
                    let rewrittenUrl = rule.replacePattern;
                    if (match.groups && Object.keys(match.groups).length > 0) {
                        for (const [key, value] of Object.entries(match.groups)) {
                            rewrittenUrl = rewrittenUrl.replace('($' + key + ')', value);
                        }
                    } else {
                        rewrittenUrl = redirectUrl.replace(regex, rule.replacePattern);
                    }
                    redirectUrl = new URL(rewrittenUrl, window.location.origin).href;
                    break;
                }
            }

            // Apply host/protocol rewrite if a host-forward rule matched
            if (hostForwardRule) {
                const target = new URL(redirectUrl);
                const hostRegex = new RegExp(hostForwardRule.hostPattern);
                const hostMatch = target.hostname.match(hostRegex);
                
                if (hostMatch) {
                    let newHostname = hostForwardRule.hostReplacePattern;
                    
                    // Replace capture groups in hostname replacement
                    if (hostMatch.groups && Object.keys(hostMatch.groups).length > 0) {
                        for (const [key, value] of Object.entries(hostMatch.groups)) {
                            newHostname = newHostname.replace('($' + key + ')', value);
                        }
                    } else {
                        newHostname = target.hostname.replace(hostRegex, hostForwardRule.hostReplacePattern);
                    }
                    
                    target.hostname = newHostname;
                    
                    // Apply protocol replacement if provided
                    if (hostForwardRule.protocolReplacePattern) {
                        target.protocol = hostForwardRule.protocolReplacePattern + ":";
                    }
                    
                    redirectUrl = target.href;
                }
            }

            window.location.href = redirectUrl;
        } catch (e) {
            console.error("Redirect failed:", e);
        }
    </script>
    <noscript>
        <p>You need to enable JavaScript!</p>
    </noscript>
</head>
</html>
